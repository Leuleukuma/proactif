<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#4a7a5c" />
<title>ProActif Pulse — Tableau de bord</title>
<link rel="stylesheet" href="pulse.css" />
<style>
  html, body { margin:0; }
  body{ background:var(--cream); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  .topbar{ background:#fff; border-bottom:1px solid var(--line); padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between; }
  .wrap{ max-width:1080px; margin:0 auto; padding:28px 24px 80px; }
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:22px 0; }
  @media (max-width:760px){ .kpis{ grid-template-columns:1fr 1fr; } }
  .kpi{ background:#fff; border:1px solid var(--line-soft); border-radius:var(--r-lg); box-shadow:var(--sh-sm); padding:18px; }
  .kpi .v{ font-family:var(--serif); font-weight:700; font-size:34px; color:var(--ink); line-height:1; }
  .kpi .v small{ font-size:14px; font-weight:600; color:var(--ink-2); }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .teamrow{ display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft); }
  .teamrow:last-child{ border-bottom:none; }
  .bar{ flex:1; height:12px; background:var(--green-soft); border-radius:999px; overflow:hidden; }
  .bar > i{ display:block; height:100%; background:var(--green); border-radius:999px; }
  .pill{ font-family:var(--sans); font-weight:600; font-size:12px; color:var(--green-dark); background:var(--green-soft); border-radius:999px; padding:3px 10px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-2); }
  .note{ display:flex; gap:10px; align-items:flex-start; background:var(--green-soft); border-radius:var(--r-md); padding:13px 16px; margin-top:22px; font-size:12.5px; line-height:1.5; color:var(--green-dark); }
  .btn-ref{ background:#fff; border:1px solid var(--line); border-radius:var(--r-pill); padding:8px 14px; font-family:var(--sans); font-weight:600; font-size:13px; color:var(--ink); cursor:pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div id="brand"></div>
  <button class="btn-ref" onclick="load()">Actualiser</button>
</div>
<div class="wrap">
  <h1 class="t-display" style="font-size:30px;">Tableau de bord <span class="t-em">équipe</span></h1>
  <p class="t-body" style="margin-top:6px;">Données agrégées et anonymisées de ta bêta. Aucune donnée individuelle n'est affichée.</p>
  <div id="content"><p class="t-meta" style="margin-top:24px;">Chargement…</p></div>
  <div class="note" id="note" style="display:none;">
    <span id="lockico"></span>
    <span>Données <b>anonymisées et agrégées</b>. Le tableau ne montre que des moyennes par équipe, jamais le ressenti d'une personne identifiable.</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="pulse-app.js"></script>
<script>
  document.getElementById('brand').innerHTML = Pulse.wordmark(19);
  document.getElementById('lockico').innerHTML = Pulse.icon('lock', { size:18, color:'var(--green-dark)' });

  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const fr = v => (v == null) ? '—' : String(v).replace('.', ',');

  async function load(){
    const el = document.getElementById('content');
    el.innerHTML = '<p class="t-meta" style="margin-top:24px;">Chargement…</p>';
    const { data, error } = await sb.rpc('team_stats');
    if(error){ el.innerHTML = '<p class="t-meta" style="margin-top:24px;color:#b3261e;">Erreur de chargement : ' + error.message + '</p>'; return; }

    const rows = (data || []).filter(r => r.team != null);
    const totalMembers  = rows.reduce((s,r)=> s + Number(r.members||0), 0);
    const totalCheckins = rows.reduce((s,r)=> s + Number(r.checkins||0), 0);

    let we=0, ws=0, wn=0;
    rows.forEach(r => { const n = Number(r.checkins||0); if(n>0 && r.avg_energy!=null){ we += Number(r.avg_energy)*n; ws += Number(r.avg_stress)*n; wn += n; } });
    const avgE = wn ? Math.round(we/wn*10)/10 : null;
    const avgS = wn ? Math.round(ws/wn*10)/10 : null;

    document.getElementById('note').style.display = totalMembers ? 'flex' : 'none';

    if(!totalMembers){
      el.innerHTML = '<div class="empty"><div class="t-h2" style="margin-bottom:8px;">Aucun participant pour l\'instant</div><p class="t-body">Partage le lien de l\'app à tes amis. Dès qu\'ils font leur premier check-in, les données apparaîtront ici.</p></div>';
      return;
    }

    const kpis = ''
      + kpi(totalMembers, '', 'Participants')
      + kpi(totalCheckins, '', 'Check-ins')
      + kpi(fr(avgE), '/ 10', 'Énergie moyenne')
      + kpi(fr(avgS), '/ 10', 'Stress moyen');

    const maxC = Math.max(1, ...rows.map(r => Number(r.checkins||0)));
    const teamRows = rows.sort((a,b)=> Number(b.checkins||0)-Number(a.checkins||0)).map(r => {
      const c = Number(r.checkins||0);
      return '<div class="teamrow">'
        + '<div class="t-label" style="width:120px;">' + escapeHtml(r.team) + '</div>'
        + '<div class="bar"><i style="width:' + Math.round(c/maxC*100) + '%"></i></div>'
        + '<div class="t-num" style="width:46px;text-align:right;">' + c + '</div>'
        + '<span class="pill">' + Number(r.members||0) + ' pers.</span>'
        + '<div class="t-meta" style="width:150px;text-align:right;">Énergie ' + fr(r.avg_energy) + ' · Stress ' + fr(r.avg_stress) + '</div>'
        + '</div>';
    }).join('');

    el.innerHTML = ''
      + '<div class="kpis">' + kpis + '</div>'
      + '<div style="background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:22px 24px;">'
      +   '<div class="row between" style="margin-bottom:8px;"><h2 class="t-h2">Participation par équipe</h2><span class="t-meta">Check-ins enregistrés</span></div>'
      +   teamRows
      + '</div>';
  }

  function kpi(v, suffix, label){
    return '<div class="kpi"><div class="t-kicker" style="color:var(--ink-2);letter-spacing:.1em;">' + label + '</div>'
      + '<div class="v" style="margin-top:10px;">' + v + (suffix ? ' <small>' + suffix + '</small>' : '') + '</div></div>';
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  load();
</script>
</body>
</html>
