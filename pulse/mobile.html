<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a7a5c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>ProActif Pulse</title>
<link rel="stylesheet" href="pulse.css" />
<style>
  html, body { margin:0; height:100%; }
  body{
    background:#d9d6cb;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  /* App container : plein écran sur téléphone, colonne centrée sur grand écran */
  #app{
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    background:var(--cream);
    overflow:hidden;
    position:relative;
  }
  @media (min-width:481px){
    #app{ box-shadow:0 0 80px rgba(31,36,33,.18); }
  }
  /* marge haute pour dégager l'encoche / barre d'état du téléphone */
  .app-head, .app-main{ padding-top:max(0px, env(safe-area-inset-top)); }
</style>
</head>
<body>
<div id="app"></div>
<script src="pulse-app.js"></script>
<script>
  "use strict";
  Pulse.mountMobile(document.getElementById('app'), { start:'onboarding' });
</script>
</body>
</html>
